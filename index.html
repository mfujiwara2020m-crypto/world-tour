<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memories - Menu</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        /* 画面中央に案内テキストを固定表示する場合のデザイン（お好みで） */
        #title-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="title-overlay">行きたい国をタッチしてください</div>

    <a-scene>
        <!-- 背景色 -->
        <a-sky color="#111111"></a-sky>

        <!-- カメラと視線カーソル -->
        <a-camera position="0 1.6 3">
            <a-cursor color="#FFF"></a-cursor>
        </a-camera>

        <!-- 【フランスへの扉：箱（カード）】 -->
        <!-- onclickで korea.html へジャンプします -->
        <a-entity position="-1.2 1.5 -2.5" onclick="location.href='korea.html'" class="clickable">
            <!-- 立体的な箱（または板） -->
            <a-box width="1.2" height="0.8" depth="0.1" color="#3a6073"></a-box>
            <!-- 国名テキスト -->
            <a-text value="korea" align="center" position="0 0 0.06" color="#FFF" width="4"></a-text>
        </a-entity>

        <!-- 【日本への扉：箱（カード）】 -->
        <!-- onclickで thai.html へジャンプします -->
        <a-entity position="1.2 1.5 -2.5" onclick="location.href='thai.html'" class="clickable">
            <!-- 立体的な箱（または板） -->
            <a-box width="1.2" height="0.8" depth="0.1" color="#d38312"></a-box>
            <!-- 国名テキスト -->
            <a-text value="thai" align="center" position="0 0 0.06" color="#FFF" width="4"></a-text>
        </a-entity>

    </a-scene>

</body>
</html>
