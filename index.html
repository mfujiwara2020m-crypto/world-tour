<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Memories - Menu</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        #title-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 10;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="title-overlay">行きたい国をタッチしてください</div>

    <a-scene>
        <!-- 背景色 -->
        <a-sky color="#111111"></a-sky>

        <!-- カメラと、クリック判定（raycaster）の追加 -->
        <a-camera position="0 1.6 3">
            <!-- objects: .clickable がついている要素だけをタップ・クリックできるようにする -->
            <a-cursor color="#FFF" raycaster="objects: .clickable"></a-cursor>
        </a-camera>

        <!-- 【韓国への扉】 -->
        <!-- class="clickable" を付与し、JavaScriptでページ遷移を実行 -->
        <a-entity position="-1.2 1.5 -2.5" class="clickable" onclick="location.href='korea.html'">
            <a-box width="1.2" height="0.8" depth="0.1" color="#3a6073"></a-box>
            <a-text value="korea" align="center" position="0 0 0.06" color="#FFF" width="4"></a-text>
        </a-entity>

        <!-- 【タイへの扉】 -->
        <a-entity position="0 1.5 -2.5" class="clickable" onclick="location.href='thailand.html'">
            <a-box width="1.2" height="0.8" depth="0.1" color="#d38312"></a-box>
            <a-text value="Thailand" align="center" position="0 0 0.06" color="#FFF" width="4"></a-text>
        </a-entity>

        <!-- 【日本への扉】 -->
        <a-entity position="1.2 1.5 -2.5" class="clickable" onclick="location.href='japan.html'">
            <a-box width="1.2" height="0.8" depth="0.1" color="#2b5876"></a-box>
            <a-text value="Japan" align="center" position="0 0 0.06" color="#FFF" width="4"></a-text>
        </a-entity>

    </a-scene>

</body>
</html>
