<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Travel Memories - A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-sky color="#222222"></a-sky>

        <!-- 標準のcameraコンポーネントを使用（これによってマウスやタッチでの視点移動が有効になります） -->
        <a-camera position="0 1.6 3">
            <a-cursor color="#FFF"></a-cursor>
        </a-camera>

        <!-- タイトル -->
        <a-text value="My Travel Memories" position="-1.5 2.8 -3" color="#FFF" width="6"></a-text>

        <!-- 日本のカード -->
        <a-entity position="-1.2 0.5 -3">
            <a-plane width="1.2" height="1.5" color="#FFF" class="clickable" onclick="location.href='countries/japan.html'"></a-plane>
            <a-text value="Japan" position="-0.4 -0.9 0.01" color="#000" width="3"></a-text>
        </a-entity>

        <!-- フランスのカード -->
        <a-entity position="1.2 0.5 -3">
            <a-plane width="1.2" height="1.5" color="#FFF" class="clickable" onclick="location.href='countries/france.html'"></a-plane>
            <a-text value="France" position="-0.4 -0.9 0.01" color="#000" width="3"></a-text>
        </a-entity>
    </a-scene>
</body>
</html>
