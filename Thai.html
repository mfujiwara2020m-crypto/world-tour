<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand - Visual Experience</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>
<body>

    <a-scene>
        <!-- 【1. タイの空気感を彩る環境音】（お好みで音声ファイルを指定） -->
        <a-sound src="sounds/thailand-ambience.mp3" autoplay="true" loop="true" volume="0.6"></a-sound>

        <!-- 【2. 視覚演出：夕暮れ〜夜のタイをイメージした背景とフォグ】 -->
        <!-- 深い藍色（夜空）に、温かいオレンジの霧で熱気を表現 -->
        <a-sky color="#1a1128"></a-sky>
        <a-fog type="exponential" color="#2c1638" density="0.06"></a-fog>

        <!-- 黄金を美しく照らすリッチなライト（ポイントライト＆アンビエント） -->
        <a-light type="point" color="#ffaa22" position="0 4 -2" intensity="2" distance="12"></a-light>
        <a-light type="ambient" color="#332244" intensity="0.6"></a-light>

        <!-- カメラと視線カーソル -->
        <a-camera position="0 1.6 2">
            <a-cursor color="#FFD700"></a-cursor>
        </a-camera>

        <!-- 【3. 視覚演出：空中に浮かぶ「黄金のひし形（八面体）」】 -->
        <!-- 寺院の尖塔や伝統文様をイメージしたダイヤモンド型のオブジェクトがゆっくり回転 -->
        <a-octahedron position="0 2.2 -3.5" radius="1.2" color="#FFD700" 
                      metalness="0.85" roughness="0.15"
                      animation="property: rotation; to: 0 360 360; loop: true; dur: 12000">
        </a-octahedron>

        <!-- 光の輝きを強調する小さなひし形を周囲に配置 -->
        <a-octahedron position="-1.5 1.5 -2.5" radius="0.4" color="#ff7700" metalness="0.5" roughness="0.2"
                      animation="property: rotation; to: 360 0 0; loop: true; dur: 8000">
        </a-octahedron>
        <a-octahedron position="1.5 1.5 -2.5" radius="0.4" color="#ff7700" metalness="0.5" roughness="0.2"
                      animation="property: rotation; to: 360 360 0; loop: true; dur: 9000">
        </a-octahedron>

        <!-- 【4. メインコンテンツ（写真とテキスト）】 -->
        <a-entity position="0 1.2 -3">
            <!-- 現地の美しいスナップ写真（2D） -->
            <a-image src="images/thailand-scene.jpg" width="2.8" height="1.8" position="0 0 0"></a-image>
            
            <!-- タイのタイトルメッセージ -->
            <a-text value="- Kingdom of Thailand -" align="center" position="0 -1.1 0" color="#FFD700" width="4.5"></a-text>
        </a-entity>

        <!-- 【5. 戻るボタン】 -->
        <a-entity position="0 0.3 -2" onclick="location.href='index.html'" class="clickable">
            <a-plane width="1.2" height="0.4" color="#222" opacity="0.8" metalness="0.3">
                <a-text value="Back to Menu" align="center" color="#FFD700" width="3" position="0 0 0.01"></a-text>
            </a-plane>
        </a-entity>

    </a-scene>

</body>
</html>
